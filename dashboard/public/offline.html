<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <title>অফলাইন মোড | VVSC</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0e14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #121524;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .icon-box {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    .icon-box svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      flex-direction: column;
    }
    button, a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #1e2438;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-secondary:active {
      transform: scale(0.98);
      background: #272f48;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="badge">অফলাইন ক্যাশিং সক্রিয়</div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>আপনার ফোনে ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না। তবে আপনার ক্যাশড অফলাইন ড্যাশবোর্ড থেকে কাজ চালিয়ে যেতে পারবেন।</p>
    <div class="btn-group">
      <a href="/" class="btn-primary">ড্যাশবোর্ডে প্রবেশ করুন</a>
      <button class="btn-secondary" onclick="window.location.reload()">পুনরায় চেষ্টা করুন</button>
    </div>
  </div>
</body>
</html>
