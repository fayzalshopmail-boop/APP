name: Daily Summary Telegram Cron (12:00 AM BST)

on:
  schedule:
    # 18:00 UTC is exactly 12:00 AM (midnight) Bangladesh Time (UTC+6)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  trigger-summary:
    name: Dispatch Midnight Closing Report
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Summary Request to Live Vercel App
        run: |
          CONCLUDED_DATE=$(date -u +%Y-%m-%d)
          echo "Triggering Daily Summary for concluded business date $CONCLUDED_DATE at $(date)"
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://app-psi-eight-55.vercel.app/api/cron/daily-summary" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer backup_secret_shop_2026_antigravity" \
            -H "x-vercel-cron: 1" \
            -d "{\"forceDate\": \"$CONCLUDED_DATE\"}")
          
          echo "$response"
          
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$status" -ne 200 ]; then
            echo "Failed with HTTP status $status"
            exit 1
          fi
          echo "Daily summary dispatched successfully!"
